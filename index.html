<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Result Publication — Demo</title>

  <!-- Use a clean, slightly condensed UI font similar to the screenshot -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="banner">
    <div class="banner-left">
      <div class="logo-wrap">
        <img class="logo" src="logo.png" alt="Government seal (replace with actual image)" />
      </div>
    </div>
    <div class="banner-right">
      <h1>WEB BASED RESULT<br/>PUBLICATION SYSTEM FOR EDUCATION BOARD</h1>
      <p class="banner-sub">JSC/JDC/SSC/DAKHIL/HSC/ALIM AND EQUIVALENT EXAMINATION</p>
    </div>
  </header>

  <main class="page">
    <section class="card">
      <p class="lead">Please provide the following information to view result</p>

      <form class="result-form" aria-label="Result search form" novalidate>
        <label class="field">
          <span class="label-text">Name of Board</span>
          <select>
            <option selected disabled>Select One</option>
            <option>Dhaka</option>
            <option>Rajshahi</option>
            <option>Comilla</option>
          </select>
        </label>

        <label class="field">
          <span class="label-text">Name of Examination</span>
          <select>
            <option selected disabled>Select One</option>
            <option>JSC</option>
            <option>SSC</option>
            <option>HSC</option>
          </select>
        </label>

        <label class="field">
          <span class="label-text">Year of Examination</span>
          <select>
            <option selected disabled>Select One</option>
            <option>2026</option>
            <option>2025</option>
            <option>2024</option>
          </select>
        </label>

        <label class="field">
          <span class="label-text label-error">Type of Result</span>
          <select>
            <option selected disabled>Select One</option>
            <option>Individual</option>
            <option>Institution</option>
            <option>GPA</option>
          </select>
        </label>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p class="powered"><strong>Powered by</strong> <em>Inter-Education Board Coordination Committee</em></p>
      <p class="muted">Result Information Maintenance and Update: Respective Board</p>
    </div>
  </footer>
</body>
</html>
